[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "qipmachine"
version = "0.1.0"
description = "GPU-accelerated computation of the quantitative image properties (QIPs) of the Aesthetics Toolbox"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Émile Bergeron"}]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "scikit-image>=0.19",
    "Pillow>=9.1",
    "torch>=1.13",
    "tqdm",
]
keywords = ["aesthetics", "image statistics", "computational aesthetics", "GPU", "QIP"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[project.optional-dependencies]
dev = ["pytest", "statsmodels"]

[project.scripts]
qip-machine = "qipmachine.cli:main"

[tool.setuptools.packages.find]
include = ["qipmachine*"]

[tool.setuptools.package-data]
qipmachine = ["data/*.npy"]
